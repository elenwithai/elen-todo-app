<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>나의 할일 리스트</title>
<meta name="description" content="매일 할일을 체크하는 나만의 To-do 웹앱" />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#6366f1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="할일리스트" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div class="header-row">
    <h1 class="app-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="m3 6 1.5 1.5L7 5"/><path d="m3 12 1.5 1.5L7 11"/><path d="m3 18 1.5 1.5L7 17"/></svg>나의 할일</h1>
    <div class="quote-marquee" id="dailyQuoteWrap"></div>
    <div class="header-actions">
      <button class="icon-btn" id="settingsBtn" aria-label="설정" title="카테고리/중요도 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </div>

  <div class="sub-tabs" id="listSubTabs">
    <button class="sub-tab active" data-view="week">주간</button>
    <button class="sub-tab" data-view="all">전체 (이번달~)</button>
  </div>

  <div id="weekNavWrap">
    <div class="week-nav">
      <button class="nav-btn" id="prevWeekBtn" aria-label="이전 주">‹</button>
      <div class="week-label" id="weekLabel">
        <span class="main"></span>
        <span class="sub"></span>
      </div>
      <button class="today-pill" id="todayBtn">오늘</button>
      <button class="nav-btn" id="nextWeekBtn" aria-label="다음 주">›</button>
    </div>

    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0 완료</div>
  </div>

  <div class="filter-row" id="filterRow">
    <label class="filter-check-label">
      <input type="checkbox" id="hideCompletedChk" />
      완료된 항목 숨기기
    </label>
  </div>
</header>

<main>
  <div id="weekViewSection">
    <button class="unscheduled-toggle" id="unscheduledToggle" style="display:none;">
      <span>📌 날짜 미정 <span id="unscheduledCount"></span></span>
      <span id="unscheduledArrow">▾</span>
    </button>
    <div class="section-title" id="unscheduledTitle" style="display:none;">
      미정 할일
    </div>
    <div class="todo-list" id="unscheduledList"></div>

    <div class="section-title" style="margin-top:6px;">
      이번 주 할일 <span class="count" id="weekCount">0</span>
    </div>
    <div class="todo-list" id="weekList"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      이 주에는 할일이 없어요.<br />오른쪽 아래 + 버튼으로 추가해보세요.
    </div>
  </div>

  <div id="allViewSection" style="display:none;">
    <div class="section-title" style="margin-top:6px;">
      전체 할일 <span class="count" id="allCount">0</span>
    </div>
    <div id="allListContainer"></div>
    <div class="empty-state" id="allEmptyState" style="display:none;">
      이번달 이후로 예정된 할일이 없어요.
    </div>
  </div>
</main>

<button class="fab" id="addBtn" aria-label="할일 추가">+</button>

<nav class="bottom-nav">
  <a href="index.html" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="m3 6 1.5 1.5L7 5"/><path d="m3 12 1.5 1.5L7 11"/><path d="m3 18 1.5 1.5L7 17"/></svg></span>할일</a>
  <a href="calendar.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></span>달력</a>
</nav>

<!-- Add / Edit sheet -->
<div class="sheet-overlay" id="addSheetOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-handle"></div>
      <h2 id="addSheetTitle">할일 추가</h2>
    </div>
    <div class="sheet-body">
      <div class="field-group">
        <label>카테고리</label>
        <select id="formCategory"></select>
      </div>
      <div class="field-group">
        <label>중요도</label>
        <select id="formPriority"></select>
      </div>
      <div class="field-group">
        <label>상세내용</label>
        <textarea id="formDetail" placeholder="할일을 입력하세요"></textarea>
      </div>
      <div class="field-group">
        <label>기한</label>
        <input type="date" id="formDue" />
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="addCancelBtn">취소</button>
      <button class="btn btn-primary" id="addSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet-overlay" id="settingsSheetOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-handle"></div>
      <h2>카테고리 · 중요도 설정</h2>
      <div class="settings-tabs">
        <button class="settings-tab active" data-tab="cat">카테고리</button>
        <button class="settings-tab" data-tab="pri">중요도</button>
      </div>
    </div>
    <div class="sheet-body">
      <div class="settings-panel active" id="catPanel">
        <div id="catChipList"></div>
        <button class="add-chip-btn" id="addCatBtn">+ 카테고리 추가</button>
      </div>
      <div class="settings-panel" id="priPanel">
        <div id="priChipList"></div>
        <button class="add-chip-btn" id="addPriBtn">+ 중요도 추가</button>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="settingsDoneBtn">완료</button>
    </div>
  </div>
</div>

<script src="store.js"></script>
<script src="quotes.js"></script>
<script src="app.js"></script>
</body>
</html>
